<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Panel del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js?v=2026-10-08o"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=2026-10-08o">
</head>
<body class="bg-paper text-ink font-sans antialiased">

  <header class="pole-top bg-ink text-white">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
      <div id="hdrLogo" class="hidden h-10 w-10 shrink-0 place-items-center overflow-hidden rounded-xl bg-white/10 font-narrow font-bold"></div>
      <div class="min-w-0 flex-1">
        <h1 id="hdrTitle" class="truncate font-narrow text-xl font-bold leading-tight">Panel de tu negocio</h1>
        <p id="who" class="truncate text-xs text-white/70"></p>
      </div>
      <div class="relative">
        <button id="btnAccount" class="hdr-avatar hidden" aria-haspopup="true" aria-expanded="false" aria-label="Mi cuenta"></button>
        <div id="acctMenu" class="hdr-menu hidden" role="menu">
          <p id="acctMenuEmail" class="truncate text-sm font-semibold text-ink"></p>
          <p id="acctMenuRole" class="text-xs text-ink/60"></p>
          <div class="mt-3 grid gap-1 border-t border-line pt-2">
            <a id="acctSuper" href="super.html" class="menu-item hidden"><i class="fa-solid fa-store"></i>Mis negocios</a>
            <button id="btnLogout" class="menu-item text-pole-red"><i class="fa-solid fa-right-from-bracket"></i>Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Ingreso -->
  <section id="loginView" class="mx-auto mt-12 hidden max-w-sm px-4">
    <form id="loginForm" class="space-y-3 rounded-2xl bg-white p-6">
      <h2 class="font-narrow text-2xl font-bold">Ingresar al panel</h2>
      <label class="field"><span>Correo</span><input name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn-primary w-full" type="submit">Ingresar</button>
      <button id="btnForgotAdmin" type="button" class="w-full text-center text-sm text-pole-blue underline">Olvidé mi contraseña</button>
    </form>
  </section>

  <section id="deniedView" class="mx-auto mt-12 hidden max-w-md px-4 text-center">
    <p class="rounded-2xl bg-white p-6">Esta cuenta no tiene acceso al panel. Pide al dueño que te dé acceso o ingresa con otra cuenta.</p>
    <button id="btnLogoutDenied" class="btn-light mt-3">Salir</button>
  </section>

  <!-- Aplicación. Menú como en Epic: cuadrícula en celular, barra lateral en computador -->
  <div id="appView" class="mx-auto hidden max-w-6xl px-4 pb-24 pt-4 lg:grid lg:grid-cols-[230px_minmax(0,1fr)] lg:items-start lg:gap-6">
    <div class="mb-5 space-y-3 lg:sticky lg:top-6 lg:mb-0">
    <nav class="rounded-2xl border border-line bg-white/60 p-2" aria-label="Secciones">
      <div class="hidden px-2 pb-2 pt-1 lg:block"><span class="text-[10px] font-bold uppercase tracking-wider text-ink/50">Secciones</span></div>
      <div id="tabs" class="grid grid-cols-3 gap-1.5 lg:grid-cols-1"></div>
    </nav>
    <!-- Tarjeta del link para clientes -->
    <section id="linkCard" class="hidden rounded-2xl border border-line bg-white p-3" aria-labelledby="linkTitle">
      <div class="mb-2 flex items-center gap-2">
        <span class="link-ico grid h-8 w-8 shrink-0 place-items-center rounded-lg"><i class="fa-solid fa-link"></i></span>
        <div class="min-w-0"><p id="linkTitle" class="text-sm font-bold leading-tight">Link clientes</p><p class="text-[11px] text-ink/60">Tu página para que agenden</p></div>
      </div>
      <p id="linkUrl" class="mb-2 truncate rounded-lg bg-paper px-2.5 py-2 font-mono text-xs"></p>
      <div class="grid grid-cols-5 gap-1.5 text-center text-[10px] font-semibold text-ink/70">
        <button class="link-act" data-link="copy"><i class="fa-regular fa-copy"></i>Copiar</button>
        <button class="link-act" data-link="share"><i class="fa-solid fa-share-nodes"></i>Compartir</button>
        <button class="link-act" data-link="wa"><i class="fa-brands fa-whatsapp"></i>WhatsApp</button>
        <button class="link-act" data-link="qr"><i class="fa-solid fa-qrcode"></i>QR</button>
        <a class="link-act" id="linkOpen" target="_blank" rel="noopener"><i class="fa-regular fa-eye"></i>Ver</a>
      </div>
    </section>
    </div>
    <div id="adminContent" class="min-w-0">
      <div id="planBanner" class="mb-4 hidden space-y-1 rounded-xl border border-amber-300 bg-amber-50 p-4 text-sm font-semibold text-amber-900"></div>
      <section id="tab-agenda" class="tab-panel"></section>
      <section id="tab-staff" class="tab-panel hidden"></section>
      <section id="tab-clients" class="tab-panel hidden"></section>
      <section id="tab-services" class="tab-panel hidden"></section>
      <section id="tab-settings" class="tab-panel hidden"></section>
      <section id="tab-appearance" class="tab-panel hidden"></section>
      <section id="tab-images" class="tab-panel hidden"></section>
    </div>
  </div>

  <!-- Modal genérico: el contenido lo arma admin.js -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card max-w-xl">
      <div class="mb-4 flex items-start justify-between gap-3">
        <h3 id="modalTitle" class="font-narrow text-2xl font-bold"></h3>
        <button class="btn-ghost" data-close="modal" aria-label="Cerrar">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="admin.js?v=2026-10-08o"></script>
</body>
</html>
