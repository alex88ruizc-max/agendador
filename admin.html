<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Panel del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-paper text-ink font-sans antialiased">

  <header class="pole-top bg-ink text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-4">
      <div>
        <h1 class="font-narrow text-2xl font-bold leading-tight">Panel de tu negocio</h1>
        <p id="who" class="text-sm text-white/70"></p>
      </div>
      <div class="flex items-center gap-2">
        <a id="publicLink" href="index.html" class="btn-ghost text-sm text-white/80" target="_blank" rel="noopener">Ver página pública</a>
        <button id="btnLogout" class="btn-ghost hidden text-sm text-white/80">Salir</button>
      </div>
    </div>
  </header>

  <!-- Ingreso -->
  <section id="loginView" class="mx-auto mt-12 hidden max-w-sm px-4">
    <form id="loginForm" class="space-y-3 rounded-2xl bg-white p-6">
      <h2 class="font-narrow text-2xl font-bold">Ingresar al panel</h2>
      <label class="field"><span>Correo</span><input name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>Contraseña</span><input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn-primary w-full" type="submit">Ingresar</button>
      <button id="btnForgotAdmin" type="button" class="w-full text-center text-sm text-pole-blue underline">Olvidé mi contraseña</button>
    </form>
  </section>

  <section id="deniedView" class="mx-auto mt-12 hidden max-w-md px-4 text-center">
    <p class="rounded-2xl bg-white p-6">Esta cuenta no tiene acceso al panel. Pide al dueño que te dé acceso o ingresa con otra cuenta.</p>
  </section>

  <!-- Aplicación -->
  <div id="appView" class="mx-auto hidden max-w-6xl px-4 pb-24 pt-6">
    <div id="planBanner" class="mb-4 hidden space-y-1 rounded-xl border border-amber-300 bg-amber-50 p-4 text-sm font-semibold text-amber-900"></div>
    <nav id="tabs" class="mb-6 flex gap-1 overflow-x-auto rounded-xl bg-white p-1 text-sm font-semibold" aria-label="Secciones"></nav>
    <section id="tab-agenda" class="tab-panel"></section>
    <section id="tab-staff" class="tab-panel hidden"></section>
    <section id="tab-clients" class="tab-panel hidden"></section>
    <section id="tab-services" class="tab-panel hidden"></section>
    <section id="tab-settings" class="tab-panel hidden"></section>
  </div>

  <!-- Modal genérico: el contenido lo arma admin.js -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card max-w-xl">
      <div class="mb-4 flex items-start justify-between gap-3">
        <h3 id="modalTitle" class="font-narrow text-2xl font-bold"></h3>
        <button class="btn-ghost" data-close="modal" aria-label="Cerrar">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
