<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abriendo…</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#F2F5F8; color:#14213D; }
    .box { text-align:center; padding:24px; }
    .sp { width:38px; height:38px; border-radius:50%; border:4px solid #DDE3EA; border-top-color:#2B59C3; margin:0 auto 14px; animation:r 0.8s linear infinite; }
    @keyframes r { to { transform:rotate(360deg); } }
    a { color:#2B59C3; font-weight:700; }
  </style>
</head>
<body>
  <div class="box"><div class="sp" id="sp"></div><p id="msg">Abriendo tu enlace…</p></div>
  <script type="module">
    // Enlaces cortos: tuagenda.vip/p/XXXXXX  →  la página de pago de la cita (lo crea el bot de WhatsApp)
    const parts = location.pathname.split("/").filter(Boolean);
    const i = parts.indexOf("p");
    const id = i >= 0 ? parts[i + 1] : "";
    const base = location.pathname.slice(0, location.pathname.indexOf("/p/") + 1) || "/";
    const fail = (t) => { document.getElementById("sp").style.display = "none"; document.getElementById("msg").innerHTML = t; };
    if (!/^[A-Za-z0-9]{4,12}$/.test(id || "")) fail('Esta página no existe. <a href="' + base + 'index.html">Ir al inicio</a>');
    else import(base + "config.js").then(({ firebaseConfig }) => {
      fetch(`https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/links/${id}?key=${firebaseConfig.apiKey}`)
        .then((r) => r.ok ? r.json() : null)
        .then((d) => {
          const f = d && d.fields;
          if (!f) return fail("Este enlace ya no es válido. Escríbele de nuevo al WhatsApp del negocio.");
          const v = (k) => (f[k] && f[k].stringValue) || "";
          location.replace(`${base}index.html?b=${encodeURIComponent(v("b"))}&pagar=${encodeURIComponent(v("c"))}&t=${encodeURIComponent(v("t"))}`);
        })
        .catch(() => fail("No hay conexión. Revisa tu internet e intenta de nuevo."));
    }).catch(() => fail("No se pudo abrir el enlace."));
  </script>
</body>
</html>
